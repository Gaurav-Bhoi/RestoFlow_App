import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def environmentMatrix = new JsonSlurper().parse(file('../../config/environments.json'))
project.ext.envConfigFiles = environmentMatrix.collectEntries { name, mapping ->
    [(name): mapping.envFile]
}
project.ext.defaultEnvFile = '.env.development'
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// Per-flavor overrides make IDE builds and multi-variant builds deterministic.
def mobileValues = { String name ->
    def values = new Properties()
    file("../../${environmentMatrix[name].envFile}").withInputStream { values.load(it) }
    if (values.getProperty('APP_ENV') != name) {
        throw new GradleException("Native flavor and APP_ENV do not match")
    }
    return values
}
def nativeLocalValues = new Properties()
def nativeLocalFile = file('../../.env.stallion.local')
if (nativeLocalFile.exists()) nativeLocalFile.withInputStream { nativeLocalValues.load(it) }
def nativeValue = { String name, String key ->
    def prefix = name == 'development' ? 'STALLION_DEV' : 'STALLION_PROD'
    System.getenv("${prefix}_${key}") ?: nativeLocalValues.getProperty("${prefix}_${key}", '')
}
def quoted = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }
def publicKey = { String name ->
    def path = nativeValue(name, 'PUBLIC_KEY_PATH')
    if (!path) return ''
    def key = file("../../${path}").text.trim()
    if (key.contains('PRIVATE KEY')) throw new GradleException('Only a public key belongs in native resources')
    return key.replace('-----BEGIN PUBLIC KEY-----', '').replace('-----END PUBLIC KEY-----', '').replaceAll('\\s', '')
}

react {
    debuggableVariants = ["developmentDebug", "productionDebug", "developmentDebugOptimized", "productionDebugOptimized"]
    autolinkLibrariesWithApp()
}

def hasProductionSigning = ['RESTOFLOW_PROD_KEYSTORE', 'RESTOFLOW_PROD_STORE_PASSWORD',
    'RESTOFLOW_PROD_KEY_ALIAS', 'RESTOFLOW_PROD_KEY_PASSWORD'].every { System.getenv(it) }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.restoflow"
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "com.restoflow"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        resValue "string", "build_config_package", "com.restoflow"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        production {
            if (hasProductionSigning) {
                storeFile file(System.getenv('RESTOFLOW_PROD_KEYSTORE'))
                storePassword System.getenv('RESTOFLOW_PROD_STORE_PASSWORD')
                keyAlias System.getenv('RESTOFLOW_PROD_KEY_ALIAS')
                keyPassword System.getenv('RESTOFLOW_PROD_KEY_PASSWORD')
            }
        }
    }
    flavorDimensions += "environment"
    productFlavors {
        development {
            dimension "environment"
            applicationIdSuffix ".dev"
            signingConfig signingConfigs.debug
        }
        production {
            dimension "environment"
            signingConfig signingConfigs.production
        }
    }
    productFlavors.all { flavor ->
        def name = flavor.name
        mobileValues(name).each { key, value ->
            buildConfigField 'String', key, quoted(value)
            resValue 'string', key, quoted(value)
        }
        buildConfigField 'String', 'NATIVE_APP_ENV', quoted(name)
        def compatibilityHash = providers.exec {
            workingDir rootProject.projectDir.parentFile
            commandLine 'node', 'scripts/native-fingerprint.mjs', name, 'android'
        }.standardOutput.asText.get().trim()
        resValue 'string', 'NativeCompatibilityHash', compatibilityHash
        resValue 'string', 'StallionProjectId', environmentMatrix[name].stallionProjectId
        resValue 'string', 'StallionAppToken', nativeValue(name, 'APP_TOKEN')
        resValue 'string', 'StallionPublicSigningKey', publicKey(name)
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def name = variant.productFlavors.find { it.first == 'environment' }.second
        def release = variant.buildType == 'release'
        def capitalized = variant.name.capitalize()
        def validation = tasks.register("validate${capitalized}Environment", Exec) {
            workingDir rootProject.projectDir.parentFile
            commandLine(['node', 'scripts/validate-environment.mjs', name] +
                (release ? ['--release'] : []))
            doFirst {
                if (release && name == 'production' && !hasProductionSigning) {
                    throw new GradleException('Production release signing requires RESTOFLOW_PROD_* signing variables')
                }
            }
        }
        tasks.configureEach { task ->
            // AGP shares CMake tasks across flavors and can use another flavor's
            // preBuild. Validate on flavor-specific tasks instead.
            if (task.name == "generate${capitalized}BuildConfig" || task.name == "createBundle${capitalized}JsAndAssets") {
                task.dependsOn(validation)
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
